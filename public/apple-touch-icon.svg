<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="appleTouchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="appleTouchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for iOS style -->
  <rect width="180" height="180" rx="40" fill="#0A0A0A"/>
  
  <!-- Large VYRA V -->
  <path d="M40 40 L65 40 L90 130 L115 40 L140 40 L105 160 L75 160 Z" 
        fill="url(#appleTouchGradient)" 
        filter="url(#appleTouchGlow)"/>
  
  <!-- Cyberpunk accents -->
  <circle cx="150" cy="45" r="8" fill="#00FFFF" opacity="0.8"/>
  <rect x="30" y="150" width="120" height="3" fill="#00FFFF" opacity="0.6" rx="1.5"/>
</svg>