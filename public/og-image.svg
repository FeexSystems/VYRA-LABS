<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="socialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socialTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="socialGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#socialGradient)"/>
  
  <!-- Grid pattern overlay -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00FFFF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main VYRA logo -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="120" font-weight="bold" 
        text-anchor="middle" fill="url(#socialTextGradient)" filter="url(#socialGlow)">
    VYRA
  </text>
  
  <!-- Tagline -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="32" font-weight="normal" 
        text-anchor="middle" fill="#FFFFFF" opacity="0.9">
    AI-Powered Creator Platform
  </text>
  
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" font-weight="normal" 
        text-anchor="middle" fill="#00FFFF" opacity="0.8">
    Chat-First Interface • Real-Time Monetization • AI Tools
  </text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="40" fill="none" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  <circle cx="1000" cy="480" r="60" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
  
  <!-- Circuit lines -->
  <line x1="100" y1="500" x2="400" y2="500" stroke="#00FFFF" stroke-width="3" opacity="0.6"/>
  <line x1="800" y1="130" x2="1100" y2="130" stroke="#00FFFF" stroke-width="3" opacity="0.6"/>
</svg>