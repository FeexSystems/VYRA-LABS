<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80" fill="none">
  <defs>
    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient definitions -->
    <linearGradient id="vyraGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="200" height="80" fill="url(#shadowGradient)" rx="8" opacity="0.2"/>
  
  <!-- VYRA Text -->
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        text-anchor="middle" fill="url(#vyraGradient)" filter="url(#neonGlow)">
    VYRA
  </text>
  
  <!-- Cyberpunk accent lines -->
  <line x1="20" y1="65" x2="80" y2="65" stroke="#00FFFF" stroke-width="2" opacity="0.8"/>
  <line x1="120" y1="65" x2="180" y2="65" stroke="#00FFFF" stroke-width="2" opacity="0.8"/>
  
  <!-- Circuit-like decorative elements -->
  <circle cx="15" cy="65" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="185" cy="65" r="3" fill="#FFD700" opacity="0.8"/>
  
  <!-- Additional tech accent -->
  <rect x="85" y="62" width="30" height="6" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.6"/>
</svg>